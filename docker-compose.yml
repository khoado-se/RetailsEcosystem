services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -b -C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./src/RetailsEcosystem.Customer
      dockerfile: RetailsEcosystem.Customer.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=${DB_NAME:-RetailsEcosystemDb};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "RetailsEcosystem.API"
      JwtSettings__Audience: "RetailsEcosystem.Admin"
      JwtSettings__AccessTokenExpiryMinutes: "${JWT_ACCESS_EXPIRY_MINUTES:-15}"
      JwtSettings__RefreshTokenExpiryDays: "${JWT_REFRESH_EXPIRY_DAYS:-7}"
      AllowedOrigins__0: "${ALLOWED_ORIGIN_ADMIN:-http://localhost:3000}"
      AllowedOrigins__1: "${ALLOWED_ORIGIN_WEB:-http://localhost:8081}"
      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME:-}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY:-}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET:-}"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: ./src/RetailsEcosystem.Customer
      dockerfile: RetailsEcosystem.Customer.Web/Dockerfile
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8081"
      ApiSettings__BaseUrl: "http://api:8080/"
      VnpaySettings__TmnCode: "${VNPAY_TMN_CODE:-}"
      VnpaySettings__HashSecret: "${VNPAY_HASH_SECRET:-}"
      VnpaySettings__ReturnUrl: "${VNPAY_RETURN_URL:-http://localhost:8081/vnpay/return}"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ./src/RetailsEcosystem.Admin
      args:
        VITE_HOST_URL: "${VITE_HOST_URL:-http://localhost:8080/api}"
        VITE_PRODUCT_PLACEHOLDER_IMAGE: "${VITE_PRODUCT_PLACEHOLDER_IMAGE:-http://localhost:8080/images/products/product-placeholder-image.jpg}"
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
