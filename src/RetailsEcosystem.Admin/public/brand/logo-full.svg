    <path d="M 11 15 C 11 6 19 6 19 15" stroke="#4A90D9" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 21 15 C 21 6 29 6 29 15" stroke="#4A90D9" stroke-width="3" stroke-linecap="round" fill="none"/>
